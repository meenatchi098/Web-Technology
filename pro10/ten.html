<!DOCTYPE html>
<html>
<head>
    <title>Mouse and Form Event Example</title>
    <script src="style.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            margin-top: 20px;
        }

        #myElement {
            width: 90%;
            margin: 20px auto;
            padding: 12px;
            background-color: yellow;
            border: 3px solid black;
            font-size: 18px;
        }

        form {
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h2>Mouse and Form Event Example</h2>

    <div id="myElement"
         onmouseover="handleMouseOver()"
         onmouseout="handleMouseOut()">
        Move the mouse here to change color.
    </div>

    <form onsubmit="handleSubmit(event)">
        <label>Enter a value:</label>
        <input type="text" id="myInput">
        <input type="submit" value="Submit">
    </form>

</body>
</html>
