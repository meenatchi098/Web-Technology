<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Demonstration</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#eef3fa;
        }

        h1{
            text-align:center;
            color:#003366;
            margin:40px 0;
            font-size:40px;
        }

        .container{
            width:90%;
            margin:auto;

            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:40px;
        }

        .card{
            height:220px;
            border-radius:15px;
            box-shadow:0px 6px 12px rgba(0,0,0,0.2);

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;

            text-align:center;
        }

        .card h2{
            margin-bottom:20px;
            font-size:30px;
        }

        .card p{
            font-size:20px;
            width:80%;
        }

        /* Internal CSS */

        .internal{
            background:#e8ffe8;
            color:green;
            border:3px solid green;
        }

    </style>

</head>

<body>

<h1>CSS Demonstration</h1>

<div class="container">

    <!-- Inline CSS -->

    <div class="card"
    style="background:#ffe6e6;
           color:red;
           border:3px solid red;">

        <h2>Inline CSS</h2>

        <p>
            This card is designed using Inline CSS.
        </p>

    </div>

    <!-- Internal CSS -->

    <div class="card internal">

        <h2>Internal CSS</h2>

        <p>
            This card is designed using Internal CSS.
        </p>

    </div>

    <!-- External CSS -->

    <div class="card external">

        <h2>External CSS</h2>

        <p>
            This card is designed using External CSS.
        </p>

    </div>

</div>

</body>
</html>
