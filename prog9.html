<!DOCTYPE html>
<html>
<head>
    <title>Hide Paragraph Using jQuery</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function() {
            $("#hide").click(function() {
                $("#para").hide();
            });
        });
    </script>
</head>

<body>

    <h2>jQuery Hide Paragraph Example</h2>

    <p id="para">
        This is a paragraph. Click the button to hide this paragraph.
    </p>

    <button id="hide">Hide Paragraph</button>

</body>
</html>
